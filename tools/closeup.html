<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Nahansicht</title>
<style>html,body{margin:0;background:#e0a040}canvas{display:block}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script type="module">
// Nahansicht einzelner Figuren vor hellem Hintergrund (Gegenlicht-Stil).
import { drawHumanoid, makePose, COSTUMES, Cloth, solveRig, drawEyesGlow } from '../src/render/puppet.js';
const ctx = document.getElementById('c').getContext('2d');
const g = ctx.createLinearGradient(0, 0, 0, 720);
g.addColorStop(0, '#f2b34a'); g.addColorStop(1, '#8a3a12');
ctx.fillStyle = g; ctx.fillRect(0, 0, 1280, 720);
const S = 8;
function show(name, anim, x, y, opts = {}) {
  ctx.save(); ctx.scale(S, S);
  const fx = x / S, fy = y / S, f = opts.facing ?? 1;
  const pose = makePose(anim, 0.8, { progress: 0.55, phase: 1.2 });
  const c = COSTUMES[name];
  let cape = null, hair = null;
  if (c.cape) {
    cape = new Cloth(8, 3.1, 560, 0.07); hair = new Cloth(5, 2.6, 400, 0.12);
    const rig = solveRig(pose, (opts.sz ?? 1) * 1.12);
    const ax = fx + f * (rig.neck.x - 1.6), ay = fy + rig.neck.y + 1.2;
    cape.reset(ax, ay); hair.reset(fx + f * (rig.head.x - 2.2), fy + rig.head.y - 1);
    for (let i = 0; i < 160; i++) { cape.update(1 / 60, ax, ay, fy, (opts.wind ?? -200) * f); hair.update(1 / 60, fx + f * (rig.head.x - 2.2), fy + rig.head.y - 1, fy, (opts.wind ?? -200) * f * 0.6); }
  }
  const rig = drawHumanoid(ctx, fx, fy, f, pose, c, { cape, hair, t: 1, sz: opts.sz ?? 1 });
  if (c.eyes) drawEyesGlow(ctx, fx, fy, f, rig, c.eyes, false);
  ctx.restore();
}
show('ingomar', 'idle', 170, 560);
show('yvonne', 'idle', 390, 560, { facing: -1 });
show('renate', 'idle', 620, 560);
show('egon', 'idle', 840, 560);
show('henry', 'idle', 1070, 560, { facing: -1, sz: 0.78 });
window.__ready = true;
</script></body></html>
